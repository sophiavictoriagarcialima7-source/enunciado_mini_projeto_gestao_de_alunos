<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Cadastro e Gerenciamento de Alunos</title>
  </head>
  <body>
    <form id="formulario">
      <label>Nome completo: </label><input type="text" id="nome" placeholder="Nome completo" name="nome"
      />
      <label>Idade: </label><input type="number" id="idade" placeholder="idade" name="idade"
      />
      <label>Turma: </label><input type="text" id="turma" placeholder="Turma" name="turma"
      />
      <label>Nota 1</label>
      <input
        type="number"
        id="nota1"
        placeholder="Nota 1"
        name="nota1"
        min="0"
        max="10"
        required
      />
      <label> Nota 2</label>
      <input
        type="number"
        id="nota2"
        placeholder="Nota 2"
        name="nota2"
        min="0"
        max="10"
        required
      />

      <button type="submit">Enviar</button>

    </form>
    
    <script src="script.js"></script>
  </body>
</html>
