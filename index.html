<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Sistema de Cadastro e Gerenciamento de Alunos</title>
    
  </head>
  <body>
    <form id="formulario">

    <h1>Sistema de Cadastro e Gerenciamento de Alunos</h1>      
      
      <label>Nome completo: </label
      ><input type="text" id="nome" placeholder="Nome completo" name="nome" />
     
      <label>Idade: </label
      ><input type="number" id="idade" placeholder="idade" name="idade" />
     
      <label>Turma: </label
      ><input type="text" id="turma" placeholder="Turma" name="turma" />
      
   
      <label>Nota 1:</label>
      <input
        type="number"
        id="nota1"
        placeholder="Informe a primeira nota"
        name="nota1"
        min="0"
        max="10"
        required
      />
    
      <label> Nota 2:</label>
      <input
        type="number"
        id="nota2"
        placeholder="Informe a segunda nota"
        name="nota2"
        min="0"
        max="10"
        required
      />

      <p>
      <button type="submit">Limpar</button>
      </p>

    </form>
    <p id="resumo"></p>

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Idade</th>
          <th>Turma</th>
          <th>Nota 1</th>
          <th>Nota 2</th>

          <th>Situação</th>
